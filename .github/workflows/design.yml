# A short run for design work: one Debug build and the screens that show the look, about ten
# minutes instead of the full run's forty.
name: Design preview

on:
  push:
    branches:
      - fasting3
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'server/**'
  workflow_dispatch:

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          latest=$(python3 - <<'PY'
          import glob, re
          apps = [a for a in glob.glob('/Applications/Xcode_*.app') if not re.search(r'beta|rc', a, re.I)]
          key = lambda a: [int(n) for n in re.findall(r'\d+', a.split('Xcode_', 1)[1])]
          print(max(apps, key=key) if apps else '')
          PY
          )
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bite.xcodeproj \
            -scheme Bite \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Screenshots
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/Bite.app
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in devices.items() if "iOS" in runtime for d in items
                    if d["name"].startswith("iPhone") and "SE" not in d["name"]]
          preferred = [d for d in phones if d["name"] in ("iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro")]
          print((preferred or phones)[-1]["udid"])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.ContinuousPath DidShowContinuousPathIntroduction -bool true || true
          mkdir -p screenshots

          shoot() {
            name=$1; shift
            case "$*" in
              *AppleLocale*) ;;
              *) set -- "$@" -AppleLocale en_IE ;;
            esac
            xcrun simctl terminate "$UDID" com.dylan.bite >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.dylan.bite -demo YES -health.asked YES "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }

          # The plan, visual first: the two bodies, what you burn, the muscle pane, for Dylan's numbers and for big ones.
          shoot 130-plan -onboarded YES -screen fasting -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 131-plan-burn -onboarded YES -screen fasting -anchor burn -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 132-plan-burn-sport -onboarded YES -screen fasting -anchor burn -fasting.steps 12500 -fasting.sports "boxing:60:3 tennis:90:2 running:45:4" -fasting.sportOpen YES -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 133-plan-methods -onboarded YES -screen fasting -anchor methods -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 134-plan-cycle -onboarded YES -screen fasting -anchor cycle -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 135-plan-muscle -onboarded YES -screen fasting -anchor muscle -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 136-plan-electrolytes -onboarded YES -screen fasting -anchor electrolytes -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 137-plan-end -onboarded YES -screen fasting -anchor bottom -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 138-plan-big -onboarded YES -screen fasting -fasting.weight 150 -body.sex male -body.age 45 -body.height 190 -body.activity active -fasting.steps 12500 -fasting.sports "boxing:60:3 tennis:90:2 running:45:4"
          shoot 139-plan-woman -onboarded YES -screen fasting -fasting.weight 72 -body.sex female -body.age 34 -body.height 170 -body.activity light -fasting.once YES -fasting.days 5
          shoot 140-plan-fr -onboarded YES -screen fasting -AppleLanguages "(fr)" -AppleLocale fr_FR -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 141-plan-fr-muscle -onboarded YES -screen fasting -anchor muscle -AppleLanguages "(fr)" -AppleLocale fr_FR -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 142-plan-es-burn -onboarded YES -screen fasting -anchor burn -AppleLanguages "(es)" -AppleLocale es_ES -fasting.sports "running:45:3" -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 143-plan-paper -onboarded YES -screen fasting -look paper -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 144-plan-paper-burn -onboarded YES -screen fasting -anchor burn -look paper -fasting.sports "running:45:3" -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light
          shoot 145-plan-low-bmi -onboarded YES -screen fasting -fasting.weight 52


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
