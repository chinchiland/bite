# A short run for design work: one Debug build and the screens that show the look, about ten
# minutes instead of the full run's forty.
name: Design preview

on:
  push:
    branches:
      - glass
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'server/**'
  workflow_dispatch:

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          latest=$(python3 - <<'PY'
          import glob, re
          apps = [a for a in glob.glob('/Applications/Xcode_*.app') if not re.search(r'beta|rc', a, re.I)]
          key = lambda a: [int(n) for n in re.findall(r'\d+', a.split('Xcode_', 1)[1])]
          print(max(apps, key=key) if apps else '')
          PY
          )
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bite.xcodeproj \
            -scheme Bite \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Screenshots
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/Bite.app
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in devices.items() if "iOS" in runtime for d in items
                    if d["name"].startswith("iPhone") and "SE" not in d["name"]]
          preferred = [d for d in phones if d["name"] in ("iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro")]
          print((preferred or phones)[-1]["udid"])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.ContinuousPath DidShowContinuousPathIntroduction -bool true || true
          mkdir -p screenshots

          shoot() {
            name=$1; shift
            case "$*" in
              *AppleLocale*) ;;
              *) set -- "$@" -AppleLocale en_IE ;;
            esac
            xcrun simctl terminate "$UDID" com.dylan.bite >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.dylan.bite -demo YES -health.asked YES "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }

          shoot 00-welcome
          shoot 01-today -onboarded YES
          shoot 01b-today-card -onboarded YES -cover card
          shoot 36b-cover-card -onboarded YES -screen cover2 -cover card
          shoot 37-today-middle -onboarded YES -anchor center
          shoot 22-today-end -onboarded YES -anchor bottom
          shoot 36-cover-breakfast -onboarded YES -screen cover2
          shoot 26-today-over -onboarded YES -screen over
          shoot 02-food -onboarded YES -screen food
          shoot 25-food-plate -onboarded YES -screen plate
          shoot 08-estimate -onboarded YES -screen estimate
          shoot 09-week -onboarded YES -screen week
          shoot 24-week-end -onboarded YES -screen week -anchor bottom
          shoot 10-month -onboarded YES -screen month
          shoot 03-search -onboarded YES -screen search -query skyr
          shoot 05-settings -onboarded YES -screen settings
          shoot 30-place -onboarded YES -screen place
          shoot 31-dish -onboarded YES -screen dish
          shoot 07-scan-food -onboarded YES -screen photo
          shoot 75-menu -onboarded YES -screen menu
          shoot 78-typical -onboarded YES -screen typical -query shawarma
          shoot 57-mirror -onboarded YES -screen mirror
          shoot 11-saved-editor -onboarded YES -screen saved
          shoot 16-today-fr -onboarded YES -AppleLanguages "(fr)" -AppleLocale fr_FR
          shoot 90-paper-today -onboarded YES -look paper
          shoot 91-paper-food -onboarded YES -screen food -look paper
          shoot 92-paper-week -onboarded YES -screen week -look paper

          shoot_fresh() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.dylan.bite >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.dylan.bite -AppleLocale en_IE "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          xcrun simctl uninstall "$UDID" com.dylan.bite
          xcrun simctl install "$UDID" "$APP"
          shoot_fresh 60-fresh-welcome
          shoot_fresh 61-fresh-today -onboarded YES
          shoot_fresh 67-first-bite -onboarded YES -firstRun.stage firstBite
          shoot_fresh 68-first-goal -onboarded YES -firstRun.stage goal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
