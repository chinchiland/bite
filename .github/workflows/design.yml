# A short run for design work: one Debug build and the screens that show the look, about ten
# minutes instead of the full run's forty.
name: Design preview

on:
  push:
    branches:
      - body3d
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'server/**'
  workflow_dispatch:

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          latest=$(python3 - <<'PY'
          import glob, re
          apps = [a for a in glob.glob('/Applications/Xcode_*.app') if not re.search(r'beta|rc', a, re.I)]
          key = lambda a: [int(n) for n in re.findall(r'\d+', a.split('Xcode_', 1)[1])]
          print(max(apps, key=key) if apps else '')
          PY
          )
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bite.xcodeproj \
            -scheme Bite \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Screenshots
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/Bite.app
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in devices.items() if "iOS" in runtime for d in items
                    if d["name"].startswith("iPhone") and "SE" not in d["name"]]
          preferred = [d for d in phones if d["name"] in ("iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro")]
          print((preferred or phones)[-1]["udid"])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.ContinuousPath DidShowContinuousPathIntroduction -bool true || true
          mkdir -p screenshots

          shoot() {
            name=$1; shift
            case "$*" in
              *AppleLocale*) ;;
              *) set -- "$@" -AppleLocale en_IE ;;
            esac
            xcrun simctl terminate "$UDID" com.dylan.bite >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.dylan.bite -demo YES -health.asked YES "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }

          # Your body: the stage in each outfit and move, the pickers, the chart, a woman, French,
          # Spanish, Paper, a first visit from the demo's numbers, and the ways in.
          shoot 150-body -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand
          shoot 151-body-clothes -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.outfit clothes -bodymap.move strike
          shoot 152-body-fat -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.outfit fat -bodymap.move flex
          shoot 153-body-now -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand -anchor now -bodymap.tape YES
          shoot 154-body-goal -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand -anchor goal
          shoot 155-body-chart -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand -anchor chart
          shoot 156-body-end -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand -anchor bottom
          shoot 157-body-woman -onboarded YES -screen body -bodymap.sex female -bodymap.height 165 -bodymap.now 68:34 -bodymap.goal 60:25 -bodymap.move flex -bodymap.tone 3
          shoot 158-body-woman-chart -onboarded YES -screen body -bodymap.sex female -bodymap.height 165 -bodymap.now 68:34 -bodymap.goal 60:25 -bodymap.move stand -anchor chart -bodymap.tone 3
          shoot 159-body-walk -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move walk -bodymap.tone 4
          shoot 160-body-fr -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand -AppleLanguages "(fr)" -AppleLocale fr_FR
          shoot 161-body-fr-goal -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand -anchor goal -AppleLanguages "(fr)" -AppleLocale fr_FR
          shoot 162-body-es-now -onboarded YES -screen body -bodymap.sex female -bodymap.height 165 -bodymap.now 68:34 -bodymap.goal 60:25 -bodymap.move stand -anchor now -bodymap.tape YES -AppleLanguages "(es)" -AppleLocale es_ES
          shoot 163-body-paper -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand -look paper
          shoot 164-body-paper-chart -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:30 -bodymap.goal 72:15 -bodymap.move stand -anchor chart -look paper
          shoot 165-body-first -onboarded YES -screen body
          shoot 166-body-beyond -onboarded YES -screen body -bodymap.sex male -bodymap.height 165 -bodymap.now 85:12 -bodymap.goal 90:10 -bodymap.move flex
          shoot 167-today-middle -onboarded YES -anchor center
          shoot 168-plan-3d -onboarded YES -screen fasting -fasting.weight 85 -body.sex male -body.age 30 -body.height 165 -body.activity light

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
