# Builds Bite on a Mac in the cloud, so it works from a Windows PC too.
# Each run uploads:
#   screenshots              real simulator screenshots of every screen, light and dark, a fresh
#                            install, and Bite Demo opened with no arguments
#   Bite-unsigned-ipa        Bite, to install on your iPhone with Sideloadly and your Apple ID
#   Bite-Demo-unsigned-ipa   Bite Demo, the same app on two weeks of sample meals, next to Bite
# How to install them: docs/iphone.md
name: Build Bite

on:
  push:
    # Words alone don't need a cloud Mac.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The newest released Xcode on the runner. With Xcode 26 the dock, the toast and the
      # photo pills are Liquid Glass; older Xcodes build the frosted fallback.
      - name: Use the newest Xcode
        run: |
          latest=$(python3 - <<'PY'
          import glob, re
          apps = [a for a in glob.glob('/Applications/Xcode_*.app') if not re.search(r'beta|rc', a, re.I)]
          key = lambda a: [int(n) for n in re.findall(r'\d+', a.split('Xcode_', 1)[1])]
          print(max(apps, key=key) if apps else '')
          PY
          )
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bite.xcodeproj \
            -scheme Bite \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Screenshots
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/Bite.app
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in devices.items() if "iOS" in runtime for d in items
                    if d["name"].startswith("iPhone") and "SE" not in d["name"]]
          preferred = [d for d in phones if d["name"] in ("iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro")]
          print((preferred or phones)[-1]["udid"])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          # The keyboard's "slide to type" card would cover the search screens.
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.ContinuousPath DidShowContinuousPathIntroduction -bool true || true
          mkdir -p screenshots

          shoot() {
            name=$1; shift
            # English screens in Irish format, metric like the Swiss: kg, m, 24 hour times.
            case "$*" in
              *AppleLocale*) ;;
              *) set -- "$@" -AppleLocale en_IE ;;
            esac
            xcrun simctl terminate "$UDID" com.dylan.bite >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.dylan.bite -demo YES -health.asked YES "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }

          shoot 00-welcome
          shoot 01-today -onboarded YES
          shoot 02-food -onboarded YES -screen food
          shoot 03-search -onboarded YES -screen search -query skyr
          shoot 04-saved-and-recent -onboarded YES -screen search
          shoot 05-settings -onboarded YES -screen settings
          shoot 06-scan-barcode -onboarded YES -screen scanner
          shoot 07-scan-food -onboarded YES -screen photo
          shoot 08-estimate -onboarded YES -screen estimate
          shoot 09-week -onboarded YES -screen week
          shoot 10-month -onboarded YES -screen month
          shoot 11-saved-editor -onboarded YES -screen saved
          shoot 12-edit -onboarded YES -screen edit
          xcrun simctl ui "$UDID" appearance dark
          shoot 13-today-dark -onboarded YES
          shoot 14-food-dark -onboarded YES -screen food
          shoot 15-week-dark -onboarded YES -screen week
          xcrun simctl ui "$UDID" appearance light
          shoot 16-today-fr -onboarded YES -AppleLanguages "(fr)" -AppleLocale fr_FR
          shoot 17-food-fr -onboarded YES -screen food -AppleLanguages "(fr)" -AppleLocale fr_FR
          shoot 18-settings-fr -onboarded YES -screen settings -AppleLanguages "(fr)" -AppleLocale fr_FR
          shoot 19-today-es -onboarded YES -AppleLanguages "(es)" -AppleLocale es_ES
          shoot 20-week-es -onboarded YES -screen week -AppleLanguages "(es)" -AppleLocale es_ES
          shoot 21-estimate-es -onboarded YES -screen estimate -AppleLanguages "(es)" -AppleLocale es_ES
          shoot 22-today-end -onboarded YES -anchor bottom
          shoot 23-yesterday -onboarded YES -screen yesterday
          shoot 24-week-end -onboarded YES -screen week -anchor bottom
          shoot 25-food-plate -onboarded YES -screen plate
          shoot 26-today-over -onboarded YES -screen over
          shoot 27-today-over-fr -onboarded YES -screen over -AppleLanguages "(fr)" -AppleLocale fr_FR
          xcrun simctl ui "$UDID" appearance dark
          shoot 28-estimate-dark -onboarded YES -screen estimate
          shoot 29-place-dark -onboarded YES -screen place
          xcrun simctl ui "$UDID" appearance light
          shoot 30-place -onboarded YES -screen place
          shoot 31-dish -onboarded YES -screen dish
          shoot 32-dish-end -onboarded YES -screen dish -anchor bottom
          shoot 33-add-estimate -onboarded YES -screen addestimate
          shoot 34-accuracy -onboarded YES -screen accuracy
          shoot 35-where -onboarded YES -screen where
          shoot 36-cover-breakfast -onboarded YES -screen cover2
          shoot 37-today-middle -onboarded YES -anchor center
          shoot 38-dish-fr -onboarded YES -screen dish -AppleLanguages "(fr)" -AppleLocale fr_FR
          shoot 39-today-middle-es -onboarded YES -anchor center -AppleLanguages "(es)" -AppleLocale es_ES
          shoot 40-usual -onboarded YES -clock 19:30 -anchor usual
          shoot 41-typo -onboarded YES -screen search -query chiken
          shoot 42-settings-end -onboarded YES -screen settings -anchor bottom

          shoot_fresh() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.dylan.bite >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.dylan.bite -AppleLocale en_IE "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          xcrun simctl uninstall "$UDID" com.dylan.bite
          xcrun simctl install "$UDID" "$APP"
          shoot_fresh 60-fresh-welcome
          shoot_fresh 61-fresh-today -onboarded YES
          shoot_fresh 62-fresh-today-end -onboarded YES -anchor bottom
          shoot_fresh 63-fresh-week -onboarded YES -screen week
          shoot_fresh 64-fresh-search -onboarded YES -screen search
          shoot_fresh 65-fresh-settings -onboarded YES -screen settings
          shoot_fresh 67-first-bite -onboarded YES -firstRun.stage firstBite
          shoot_fresh 68-first-goal -onboarded YES -firstRun.stage goal
          shoot_fresh 69-first-bite-fr -onboarded YES -firstRun.stage firstBite -AppleLanguages "(fr)" -AppleLocale fr_FR
          xcrun simctl ui "$UDID" appearance dark
          shoot_fresh 66-fresh-today-dark -onboarded YES
          xcrun simctl ui "$UDID" appearance light

          # Bite Demo as a phone opens it: its own Release build with BITE_DEMO, no arguments.
          xcodebuild build \
            -project Bite.xcodeproj \
            -scheme Bite \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-demo-sim \
            CODE_SIGNING_ALLOWED=NO \
            BITE_BUNDLE_ID=com.dylan.bite.demo \
            INFOPLIST_KEY_CFBundleDisplayName="Bite Demo" \
            BITE_APP_ICON=AppIconDemo \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) BITE_DEMO' \
            EXCLUDED_SOURCE_FILE_NAMES= -quiet
          xcrun simctl install "$UDID" build-demo-sim/Build/Products/Release-iphonesimulator/Bite.app
          xcrun simctl launch "$UDID" com.dylan.bite.demo
          sleep 10
          xcrun simctl io "$UDID" screenshot screenshots/70-demo-app.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

      # The IPAs still build when a screenshot or the Bite Demo proof fails: they are what goes on the phone.
      - name: Unsigned IPA for sideloading
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bite.xcodeproj \
            -scheme Bite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/Bite.app Payload/
          # Ad-hoc signatures that carry the entitlements (Health, the App Group the widgets
          # share), so Sideloadly can keep them when it signs with your Apple ID: the widgets
          # first, then the app around them.
          sed 's/$(BITE_BUNDLE_ID)/com.dylan.bite/' Bite.entitlements > app.entitlements
          sed 's/$(BITE_BUNDLE_ID)/com.dylan.bite/' BiteWidgets.entitlements > widgets.entitlements
          codesign --force --sign - --entitlements widgets.entitlements --timestamp=none Payload/Bite.app/PlugIns/BiteWidgets.appex
          codesign --force --sign - --entitlements app.entitlements --timestamp=none Payload/Bite.app
          codesign -d --entitlements - Payload/Bite.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Bite.app/PlugIns/BiteWidgets.appex/Info.plist)" = com.dylan.bite.widgets ] \
            || { echo "::error::the widgets' bundle id does not follow the app's"; exit 1; }
          zip -qry Bite-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Bite-unsigned-ipa
          path: Bite-unsigned.ipa

      # Bite Demo: a second app next to Bite that always opens on the seeded two weeks. The same
      # Release build plus the BITE_DEMO switch, its own id, name and icon, and the demo photos
      # Release normally leaves out. Signed without Health: it never asks for it.
      - name: Bite Demo IPA for sideloading
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          xcodebuild build \
            -project Bite.xcodeproj \
            -scheme Bite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-demo \
            CODE_SIGNING_ALLOWED=NO \
            BITE_BUNDLE_ID=com.dylan.bite.demo \
            INFOPLIST_KEY_CFBundleDisplayName="Bite Demo" \
            BITE_APP_ICON=AppIconDemo \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) BITE_DEMO' \
            EXCLUDED_SOURCE_FILE_NAMES= -quiet
          APP=build-demo/Build/Products/Release-iphoneos/Bite.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.dylan.bite.demo ] || fail "Bite Demo kept Bite's bundle id"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "Bite Demo" ] || fail "Bite Demo is not named Bite Demo"
          for photo in shawarma shawarma-fries salmon-bowl salmon-plate egg-bowl buddha-bowl steak pizza; do
            [ -f "$APP/demo-$photo.jpg" ] || fail "demo-$photo.jpg is missing from Bite Demo"
          done
          rm -rf DemoIPA && mkdir -p DemoIPA/Payload
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/PlugIns/BiteWidgets.appex/Info.plist")" = com.dylan.bite.demo.widgets ] \
            || fail "Bite Demo's widgets kept Bite's bundle id"
          cp -R "$APP" DemoIPA/Payload/
          sed 's/$(BITE_BUNDLE_ID)/com.dylan.bite.demo/' BiteWidgets.entitlements > demo-widgets.entitlements
          codesign --force --sign - --entitlements demo-widgets.entitlements --timestamp=none DemoIPA/Payload/Bite.app/PlugIns/BiteWidgets.appex
          codesign --force --sign - --timestamp=none DemoIPA/Payload/Bite.app
          (cd DemoIPA && zip -qry ../Bite-Demo-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Bite-Demo-unsigned-ipa
          path: Bite-Demo-unsigned.ipa
